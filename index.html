<script>
// Dashboard info panel script
function updateDashboard() {
    // Get local time
    const localTime = new Date().toLocaleString();
    document.getElementById('local-time').innerText = `Local Time: ${localTime}`;

    // Time on page
    let timeOnPage = 0;
    setInterval(() => {
        timeOnPage++;
        document.getElementById('time-on-page').innerText = `Time on Page: ${timeOnPage} seconds`;
    }, 1000);

    // Mouse stats
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
        document.getElementById('mouse-stats').innerText = `Mouse Position: (${mouseX}, ${mouseY})`;
    });

    // Moon phase
    async function getMoonPhase() {
        const response = await fetch('https://api.farmsense.net/v1/moonphases/?d=' + Math.floor(Date.now() / 1000));
        const data = await response.json();
        document.getElementById('moon-phase').innerText = `Moon Phase: ${data[0].Phase}`;
    }
    getMoonPhase();

    // Weather
    async function getWeather() {
        const response = await fetch('https://api.openweathermap.org/data/2.5/weather?q=YourCity&appid=YourAPIKey');
        const data = await response.json();
        document.getElementById('weather').innerText = `Weather: ${data.weather[0].description}`;
    }
    getWeather();

    // Screen, browser, platform, language, timezone
    document.getElementById('screen').innerText = `Screen: ${screen.width}x${screen.height}`;
    document.getElementById('browser').innerText = `Browser: ${navigator.userAgent}`;
    document.getElementById('platform').innerText = `Platform: ${navigator.platform}`;
    document.getElementById('language').innerText = `Language: ${navigator.language}`;
    document.getElementById('timezone').innerText = `Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;

    // Online status
    document.getElementById('online').innerText = `Online: ${navigator.onLine ? 'Yes' : 'No'}`;

    // Battery status
    navigator.getBattery().then(battery => {
        document.getElementById('battery').innerText = `Battery: ${battery.level * 100}%`;
    });

    // Scroll position
    window.addEventListener('scroll', () => {
        document.getElementById('scroll').innerText = `Scroll Position: ${window.scrollY}`;
    });

    // Random fact
    async function getRandomFact() {
        const response = await fetch('https://api.api-ninjas.com/v1/facts');
        const data = await response.json();
        document.getElementById('random-fact').innerText = `Random Fact: ${data[0].fact}`;
    }
    getRandomFact();

    // Verse
    async function getVerse() {
        const response = await fetch('https://api.verses.com/v1/random');
        const data = await response.json();
        document.getElementById('verse').innerText = `Verse: ${data.text}`;
    }
    getVerse();
}

// Call the function to update the dashboard
updateDashboard();
</script>
