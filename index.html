<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hows the wheater? :)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 50px;
    }
    #imageContainer {
        display: none;
        margin-top: 20px;
    }
    img {
        max-width: 100%;
        height: auto;
    }
    .button-container {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
    }

    /* Continuous spin */
    .stretch-flip {
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
        cursor: pointer;
        display: inline-block;
        user-select: none;
    }

    /* Boop animation (scale + rotate) */
    .boop {
        animation: boopAnim 0.2s ease forwards;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }

    @keyframes boopAnim {
        0% {
            transform: rotate(0deg) scale(1);
        }
        50% {
            transform: rotate(-15deg) scale(1.2);
        }
        100% {
            transform: rotate(0deg) scale(1);
        }
    }
</style>
</head>
<body>
    <h1>Darius cool website because why not. (defenetly not related to season 2)</h1>

    <div class="button-container">
        <button onclick="checkPassword()">Enter Password</button>
        <img src="ratcatcher.jpg" alt="Ratcatcher" class="stretch-flip" id="ratcatcher" />
    </div>

    <div id="imageContainer">
        <img src="Screenshot 2025-05-13 224508.png" alt="Hidden Image" />
    </div>

    <script>
        function checkPassword() {
            const correctPassword = "coolandepic";
            const userPassword = prompt("enter password");
            if (userPassword === correctPassword) {
                alert("53450n 2 v3r7 500n (press ok)");
                document.getElementById("imageContainer").style.display = "block";
            } else if (userPassword !== null) {
                alert("TRY. AGAIN.");
            }
        }

        const ratcatcher = document.getElementById('ratcatcher');
        const boopSoundSrc = "boop.mp3";

        ratcatcher.addEventListener('click', () => {
            const sound = new Audio(boopSoundSrc);
            sound.play();
            ratcatcher.classList.add('boop');
        });

        ratcatcher.addEventListener('animationend', () => {
            ratcatcher.classList.remove('boop');
        });
    </script>
</body>
</html>
