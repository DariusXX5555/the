<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Darius’ Ultimate Useless Dashboard</title>
<style>
  body {
    font-family: monospace;
    background: #fafafa;
    color: #222;
    text-align: center;
    padding: 40px;
  }
  h1 { margin-bottom: 30px; }
  .button-container {
    margin-bottom: 20px;
  }
  #ratcatcher {
    width: 60px; height: 60px;
    animation: spin 3s linear infinite;
    cursor: pointer; position: relative;
    display: inline-block;
    margin-left: 10px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .boop { animation: boopAnim .2s ease forwards }
  @keyframes boopAnim { 50% { transform: scale(1.3) rotate(-20deg) } }
  .confetti, .particle {
    position: absolute; pointer-events: none;
    will-change: transform, opacity;
  }
  /* info list */
  #infoPanel {
    display: inline-block;
    text-align: left;
    margin-top: 0;
    line-height: 1.5em;
  }
  #infoPanel p { margin: 5px 0; }
</style>
</head>
<body>

  <h1>Darius’ Ultimate Useless Dashboard</h1>

  <div class="button-container">
    <button onclick="checkPassword()">Enter Password</button>
    <img id="ratcatcher" src="ratcatcher.jpg" alt="Ratcatcher">
  </div>

  <div id="infoPanel">
    <p id="localTime">Local Time: --:--:--</p>
    <p id="timeOnPage">Time on Page: 0s</p>
    <p id="boopsCount">Boops: 0</p>
    <p id="bps">BPS: 0.00</p>
    <p id="mousePos">Mouse X,Y: 0, 0</p>
    <p id="mouseSpeed">Mouse Speed: 0 px/s</p>
    <p id="moonPhase">Moon: --</p>
    <p id="weather">Weather: loading…</p>
    <p id="screenSize">Screen: -- × --</p>
    <p id="browser">Browser: --</p>
    <p id="platform">Platform: --</p>
    <p id="battery">Battery: --</p>
    <p id="timezone">Timezone: --</p>
    <p id="randomFact">Fun Fact: --</p>
    <p id="backgroundColor">BG Color: --</p>
  </div>

<script>
  function checkPassword(){
    const pw = prompt("enter password");
    if(pw==="coolandepic"){
      alert("Access granted ✨"); 
    } else if(pw!==null) alert("TRY. AGAIN.");
  }

  // ratcatcher + boop + confetti
  const rat = document.getElementById('ratcatcher');
  let boops=0, boopTimes=[];
  rat.addEventListener('click', e=>{
    new Audio('boop.mp3').play();
    rat.classList.add('boop');
    rat.addEventListener('animationend',()=>rat.classList.remove('boop'),{once:true});

    // confetti
    for(let i=0;i<20;i++){
      const c=document.createElement('div');
      c.className='confetti';
      Object.assign(c.style,{
        left:`${e.clientX}px`, top:`${e.clientY}px`,
        background:`hsl(${Math.random()*360},80%,60%)`,
        width:'6px', height:'6px'
      });
      const dx=(Math.random()-0.5)*200, dy=(Math.random()-1)*200;
      c.animate([
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px,${dy}px) rotate(360deg) scale(.6)`, opacity:0 }
      ],{ duration:1500, easing:'ease-out' });
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),1600);
    }

    boops++;
    boopTimes.push(Date.now());
    document.getElementById('boopsCount').textContent = `Boops: ${boops}`;
  });

  // hover particles
  let pInt;
  function makeParticle(){
    const r=rat.getBoundingClientRect();
    const x=r.left+Math.random()*r.width, y=r.top+Math.random()*r.height;
    const p=document.createElement('div'); p.className='particle';
    Object.assign(p.style,{
      left:`${x}px`, top:`${y}px`,
      background:'#ddd', width:'5px', height:'5px'
    });
    const px=(Math.random()-0.5)*40, py=(Math.random()-0.5)*40;
    p.animate([
      { transform:'translate(0,0)', opacity:1 },
      { transform:`translate(${px}px,${py}px)`, opacity:0 }
    ],{ duration:800, easing:'ease-out' });
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
  rat.addEventListener('mouseenter',()=>pInt=setInterval(makeParticle,150));
  rat.addEventListener('mouseleave',()=>clearInterval(pInt));

  // info updates
  // Local time
  setInterval(()=>{
    document.getElementById('localTime').textContent =
      'Local Time: '+new Date().toLocaleTimeString();
  },1000);

  // Time on page
  let seconds=0;
  setInterval(()=>{
    seconds++;
    document.getElementById('timeOnPage').textContent = `Time on Page: ${seconds}s`;
  },1000);

  // Mouse pos & speed
  let last={x:0,y:0,t:Date.now()};
  document.addEventListener('mousemove',e=>{
    document.getElementById('mousePos').textContent =
      `Mouse X,Y: ${e.clientX}, ${e.clientY}`;
    const now=Date.now(), dt=(now-last.t)/1000;
    const dist=Math.hypot(e.clientX-last.x,e.clientY-last.y);
    const speed= dt?Math.round(dist/dt):0;
    document.getElementById('mouseSpeed').textContent = `Mouse Speed: ${speed} px/s`;
    last={x:e.clientX,y:e.clientY,t:now};
  });

  // BPS
  setInterval(()=>{
    const cutoff=Date.now()-1000;
    boopTimes=boopTimes.filter(ts=>ts>cutoff);
    document.getElementById('bps').textContent =
      `BPS: ${boopTimes.length.toFixed(2)}`;
  },500);

  // Moon phase
  (function updMoon(){
    const d=new Date(), m=29.5306,
          nm=new Date(2000,0,6,18,14),
          phase=((d-nm)/864e5)%m/m;
    let text='Moon: ';
    if(phase<.03||phase>.97) text+='New 🌑';
    else if(phase<.22) text+='Waxing C 🌒';
    else if(phase<.28) text+='First Q 🌓';
    else if(phase<.47) text+='Waxing G 🌔';
    else if(phase<.53) text+='Full 🌕';
    else if(phase<.72) text+='Waning G 🌖';
    else if(phase<.78) text+='Last Q 🌗';
    else text+='Waning C 🌘';
    document.getElementById('moonPhase').textContent = text;
    setTimeout(updMoon,60000);
  })();

  // Screen size
  function updScreen(){
    document.getElementById('screenSize').textContent =
      `Screen: ${window.innerWidth}×${window.innerHeight}`;
  }
  window.addEventListener('resize',updScreen);
  updScreen();

  // Browser & platform
  document.getElementById('browser').textContent =
    `Browser: ${navigator.appName} (${navigator.userAgent.match(/\(([^)]+)\)/)?.[1]||'?'})`;
  document.getElementById('platform').textContent =
    `Platform: ${navigator.platform}`;

  // Timezone
  document.getElementById('timezone').textContent =
    `Timezone: UTC${-new Date().getTimezoneOffset()/60}`;

  // Battery status
  if(navigator.getBattery){
    navigator.getBattery().then(b=>{
      function updBat(){
        document.getElementById('battery').textContent =
          `Battery: ${(b.level*100).toFixed(0)}% ${b.charging? '🔌':''}`;
      }
      b.addEventListener('levelchange', updBat);
      b.addEventListener('chargingchange', updBat);
      updBat();
    });
  } else {
    document.getElementById('battery').textContent = 'Battery: n/a';
  }

  // Random fact
  const facts=[
    "Bananas are berries, but strawberries aren’t!",
    "Honey never spoils.",
    "Octopuses have three hearts.",
    "You can hear rhubarb grow.",
    "A day on Venus is longer than a year."
  ];
  function updFact(){
    document.getElementById('randomFact').textContent =
      `Fun Fact: ${facts[Math.floor(Math.random()*facts.length)]}`;
  }
  updFact();
  setInterval(updFact,15000);

  // Weather (user location)
  (async()=>{
    const el=document.getElementById('weather');
    try{
      const pos=await new Promise((r,j)=>
        navigator.geolocation
          ? navigator.geolocation.getCurrentPosition(r,j)
          : j()
      );
      const {latitude:lat,longitude:lon}=pos.coords;
      const key='c0bdf03da33984e173d3d84c32e220ba';
      const res=await fetch(
        `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}`+
        `&units=metric&appid=${key}`
      );
      const d=await res.json();
      el.textContent =
        `Weather in ${d.name}: ${d.weather[0].description}, ${d.main.temp.toFixed(1)}°C`;
    }catch{
      el.textContent='Weather: unavailable';
    }
  })();

  // Background color cycle (slow)
  let hue=0;
  setInterval(()=>{
    hue=(hue+0.2)%360;
    document.body.style.background=`hsl(${hue},30%,95%)`;
    document.getElementById('backgroundColor').textContent =
      `BG Color: hsl(${Math.round(hue)},30%,95%)`;
  },100);
</script>

</body>
</html>
