<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How's your weather? :)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 50px;
  }
  .button-container {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  img {
    max-width: 100%;
    height: auto;
  }
  /* Spinning ratcatcher */
  .stretch-flip {
    width: 50px; height: 50px;
    animation: spin 2s linear infinite;
    cursor: pointer; position: relative;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  /* Boop */
  .boop { animation: boopAnim 0.2s ease forwards; }
  @keyframes boopAnim {
    50% { transform: rotate(-15deg) scale(1.2); }
  }
  /* Particles */
  .particle {
    position: absolute; width: 6px; height: 6px;
    background: #eee; border-radius: 50%;
    pointer-events: none; animation: particleMove 1s forwards;
  }
  @keyframes particleMove {
    to { transform: translate(var(--x),var(--y)); opacity:0; }
  }
  /* Confetti */
  .confetti {
    position: absolute; width:8px; height:8px;
    background-color: var(--color);
    pointer-events: none; animation: confettiMove 1.5s forwards;
  }
  @keyframes confettiMove {
    to { transform: translate(var(--x),var(--y)) rotate(360deg) scale(0.7); opacity:0; }
  }
  /* Info Panel */
  #infoPanel {
    margin-top: 30px; font-family: monospace; color: #333;
    line-height:1.4em; text-align:left; display:inline-block;
  }
</style>
</head>
<body>

  <h1>Darius cool website because why not.</h1>

  <div class="button-container">
    <button onclick="checkPassword()">Enter Password</button>
    <img id="ratcatcher" src="ratcatcher.jpg" class="stretch-flip" alt="Ratcatcher">
  </div>

  <div id="imageContainer" style="display:none; margin-top:20px;">
    <img src="Screenshot 2025-05-13 224508.png" alt="Hidden Image">
  </div>

  <div id="infoPanel">
    <p id="localTime">Local Time: --:--:--</p>
    <p id="timeOnPage">Time on Page: 0s</p>
    <p id="boopsCount">Boops: 0</p>
    <p id="bps">BPS: 0.00</p>
    <p id="mousePos">Mouse X,Y: 0, 0</p>
    <p id="mouseSpeed">Mouse Speed: 0 px/s</p>
    <p id="moonPhase">Moon: --</p>
    <p id="weather">Weather: Loading...</p>
  </div>

<script>
  // —— password logic
  function checkPassword() {
    const pw = prompt("enter password");
    if (pw === "coolandepic") {
      alert("53450n 2 v3r7 500n");
      document.getElementById("imageContainer").style.display = "block";
    } else if (pw!==null) alert("TRY. AGAIN.");
  }

  // —— ratcatcher effects
  const rat = document.getElementById('ratcatcher');
  let boops = 0, boopTimes = [];

  rat.addEventListener('click', e=> {
    // boop sound/anim
    new Audio('boop.mp3').play();
    rat.classList.add('boop');
    rat.addEventListener('animationend', ()=> rat.classList.remove('boop'), {once:true});

    // confetti
    for(let i=0;i<20;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=`${e.clientX}px`;
      c.style.top=`${e.clientY}px`;
      c.style.setProperty('--x',`${(Math.random()-0.5)*300}px`);
      c.style.setProperty('--y',`${(Math.random()-1)*300}px`);
      c.style.setProperty('--color',['#FFC700','#FF0000','#00FF00','#0000FF','#FF00FF'][Math.floor(Math.random()*5)]);
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),1500);
    }

    // boop counter
    boops++;
    boopTimes.push(Date.now());
    document.getElementById('boopsCount').textContent = `Boops: ${boops}`;
  });

  // hover particles
  let pInt;
  function makeParticle(){
    const rect=rat.getBoundingClientRect();
    const x=rect.left+Math.random()*rect.width;
    const y=rect.top+Math.random()*rect.height;
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=`${x}px`; p.style.top=`${y}px`;
    p.style.setProperty('--x',`${(Math.random()-0.5)*30}px`);
    p.style.setProperty('--y',`${(Math.random()-0.5)*30}px`);
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
  rat.addEventListener('mouseenter',()=> pInt=setInterval(makeParticle,200));
  rat.addEventListener('mouseleave',()=> clearInterval(pInt));


  // —— local time & time on page
  setInterval(()=>{
    const now=new Date();
    document.getElementById('localTime').textContent =
      'Local Time: '+now.toLocaleTimeString();
  },1000);

  let secs=0;
  setInterval(()=>{
    secs++;
    document.getElementById('timeOnPage').textContent = `Time on Page: ${secs}s`;
  },1000);


  // —— mouse pos & speed
  let lastMouse={x:0,y:0, t:Date.now()}, speed=0;
  document.addEventListener('mousemove',e=>{
    document.getElementById('mousePos').textContent =
      `Mouse X,Y: ${e.clientX}, ${e.clientY}`;

    const now=Date.now(), dt=(now-lastMouse.t)/1000;
    const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
    speed = dt>0 ? Math.hypot(dx,dy)/dt : 0;
    lastMouse={x:e.clientX,y:e.clientY,t:now};
    document.getElementById('mouseSpeed').textContent =
      `Mouse Speed: ${speed.toFixed(1)} px/s`;
  });


  // —— BPS (boops per second), updated every 500ms
  setInterval(()=>{
    const cutoff = Date.now()-1000;
    boopTimes = boopTimes.filter(ts => ts>cutoff);
    const bps = boopTimes.length;
    document.getElementById('bps').textContent = `BPS: ${bps.toFixed(2)}`;
  },500);


  // —— moon phase
  (function updMoon(){
    const d=new Date(), m=29.53058867,
          nm=new Date(2000,0,6,18,14),
          days=((d-nm)/864e5)%m, phase=days/m;
    let text='Moon: ';
    if(phase<0.03||phase>0.97) text+='New 🌑';
    else if(phase<0.22) text+='Waxing C 🌒';
    else if(phase<0.28) text+='First Q 🌓';
    else if(phase<0.47) text+='Waxing G 🌔';
    else if(phase<0.53) text+='Full 🌕';
    else if(phase<0.72) text+='Waning G 🌖';
    else if(phase<0.78) text+='Last Q 🌗';
    else text+='Waning C 🌘';
    document.getElementById('moonPhase').textContent = text;
    setTimeout(updMoon,60000);
  })();


  // —— weather via geolocation
  (async function(){
    const el=document.getElementById('weather');
    try {
      const pos = await new Promise((res,rej)=>
        navigator.geolocation
          ? navigator.geolocation.getCurrentPosition(res,rej)
          : rej('no geo')
      );
      const {latitude:lat,longitude:lon} = pos.coords;
      const key = 'c0bdf03da33984e173d3d84c32e220ba';
      const resp = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}`+
        `&units=metric&appid=${key}`
      );
      if(!resp.ok) throw '';
      const d = await resp.json();
      el.textContent = 
        `Weather in ${d.name}: ${d.weather[0].description}, ${d.main.temp.toFixed(1)}°C`;
    } catch {
      el.textContent = 'Weather: unable to fetch';
    }
  })();

</script>
</body>
</html>
