<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>How's your weather? :)</title>
<style>
  body {
    font-family: monospace;
    background: #fafafa;
    color: #222;
    text-align: center;
    padding: 40px;
    transition: background 1s;
  }
  h1 { margin-bottom: 30px; }
  .button-container { margin-bottom: 20px; }
  #ratcatcher {
    width: 60px; height: 60px;
    animation: spin 3s linear infinite;
    cursor: pointer; position: relative;
    display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .boop { animation: boopAnim .2s ease forwards }
  @keyframes boopAnim { 50% { transform: scale(1.3) rotate(-20deg) } }
  .confetti, .particle {
    position: absolute; pointer-events: none; will-change: transform, opacity;
  }
  #infoPanel {
    display:inline-block; text-align:left; margin-top:0; line-height:1.4em;
  }
  #infoPanel p { margin:4px 0; }
  table { margin: 10px auto; font-size:0.9em; border-collapse: collapse; }
  table td, table th { border:1px solid #ccc; padding:4px 8px; }
</style>
</head>
<body>

  <h1>Darius' cool website cuz why not</h1>

  <div class="button-container">
    <button onclick="checkPassword()">Enter Password</button>
    <img id="ratcatcher" src="ratcatcher.jpg" alt="Ratcatcher">
  </div>

  <div id="infoPanel">
    <p id="localTime">Local Time: --:--:--</p>
    <p id="timeOnPage">Time on Page: 0s</p>
    <p id="boopsCount">Boops: 0</p>
    <!-- other info lines omitted for brevity -->
  </div>

  <h2>🏆 Boop Leaderboard</h2>
  <table id="leaderboard">
    <thead><tr><th>User</th><th>Boops</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
  // ————— prompt for username
  let username = localStorage.getItem('dash_username');
  if(!username) {
    username = prompt("Pick a username for the Boop Leaderboard:") || "Anon";
    localStorage.setItem('dash_username', username);
  }

  // ————— load saved boops for this user
  let boops = parseInt(localStorage.getItem(`dash_boops_${username}`), 10) || 0;
  document.getElementById('boopsCount').textContent = `Boops: ${boops}`;
  let boopTimes = [];

  // ————— password check
  function checkPassword(){
    const pw = prompt("enter password");
    if(pw==="coolandepic"){ alert("Access granted ✨"); }
    else if(pw!==null) alert("TRY. AGAIN.");
  }

  // ————— leaderboard functions
  function saveLeader() {
    const board = JSON.parse(localStorage.getItem('dash_leaderboard')||'[]');
    const filtered = board.filter(e=>e.user!==username);
    filtered.push({user:username,boops});
    filtered.sort((a,b)=>b.boops-a.boops);
    localStorage.setItem('dash_leaderboard', JSON.stringify(filtered.slice(0,10)));
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const body = document.querySelector('#leaderboard tbody');
    body.innerHTML='';
    (JSON.parse(localStorage.getItem('dash_leaderboard')||'[]'))
      .forEach(e=>{
        const row = document.createElement('tr');
        row.innerHTML = `<td>${e.user}</td><td>${e.boops}</td>`;
        body.appendChild(row);
      });
  }
  renderLeaderboard();

  const rat = document.getElementById('ratcatcher');
  rat.addEventListener('click', e=>{
    // play, animate, confetti...
    boops++;
    boopTimes.push(Date.now());
    document.getElementById('boopsCount').textContent = `Boops: ${boops}`;
    // save to localStorage
    localStorage.setItem(`dash_boops_${username}`, boops);
    saveLeader();
  });

  // ... rest of your script unchanged ...
</script>
</body>
</html>
